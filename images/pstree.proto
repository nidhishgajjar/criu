syntax = "proto2";

message pstree_entry {
	required uint32			pid		= 1;
	required uint32			ppid		= 2;
	required uint32			pgid		= 3;
	required uint32			sid		= 4;
	repeated uint32			threads		= 5;
	/*
	 * Full PID namespace hierarchy for N-level nesting.
	 * ns_pids[0] = outermost (root ns) PID (same as pid field above)
	 * ns_pids[N-1] = innermost PID
	 * Empty for single-level (backward compatible with old images).
	 */
	repeated uint32			ns_pids		= 6;
	repeated uint32			ns_pgids	= 7;
	repeated uint32			ns_sids		= 8;
}
